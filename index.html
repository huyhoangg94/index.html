<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi người đặc biệt ❤️ 20/10</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng trái tim rơi background */
        .heart-particle {
            position: absolute;
            color: rgba(255, 75, 110, 0.7);
            animation: floatUp 4s linear infinite;
            font-size: 18px;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Khung thiệp chính */
        .card-container {
            background: rgba(255, 255, 255, 0.92);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 75, 110, 0.25);
            text-align: center;
            max-width: 420px;
            width: 90%;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            animation: bounceIn 1.2s ease;
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .icon-heart {
            font-size: 55px;
            color: #ff4b6e;
            animation: pulse 1.2s infinite;
            margin-bottom: 10px;
            display: inline-block;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 36px;
            color: #ff3366;
            margin-bottom: 15px;
        }

        .message-box {
            min-height: 90px;
            background: rgba(255, 240, 243, 0.8);
            padding: 15px;
            border-radius: 15px;
            border: 1px dashed #ff85a2;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message-text {
            color: #4a4a4a;
            font-size: 16px;
            line-height: 1.6;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: linear-gradient(45deg, #ff4b6e, #ff758c);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 75, 110, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(255, 75, 110, 0.6);
        }

        .btn-music {
            background: linear-gradient(45deg, #a18cd1, #fbc2eb);
            box-shadow: 0 5px 15px rgba(161, 140, 209, 0.4);
        }

        /* Pháo hoa khi bấm nút */
        .sparkle {
            position: absolute;
            pointer-events: none;
            animation: explode 0.6s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Nhạc nền ẩn (Tự động phát khi bấm nút) -->
    <audio id="bgMusic" loop src="https://assets.mixkit.co/music/preview/mixkit-romantic-sunset-688.mp3"></audio>

    <div class="card-container">
        <i class="fa-solid fa-heart icon-heart"></i>
        <h1>Happy Women's Day! 🌸</h1>
        
        <div class="message-box">
            <p class="message-text" id="typewriter">Nhấn vào nút bên dưới để nhận món quà đáng yêu này nhé! ❤️</p>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="nextMessage(event)">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Mở lời chúc tiếp theo ✨
            </button>
            <button class="btn btn-music" onclick="toggleMusic()">
                <i class="fa-solid fa-music"></i> <span id="musicBtnText">Bật nhạc chill 🎶</span>
            </button>
        </div>
    </div>

    <script>
        // Danh sách các lời chúc ngọt ngào
        const wishes = [
            "Chúc cậu một ngày 20/10 thật nhiều niềm vui, luôn xinh đẹp và rạng rỡ nhất nhé! 🌺",
            "Cảm ơn vì cậu đã luôn xuất hiện và mang lại thật nhiều năng lượng tích cực! ✨",
            "Mong rằng mọi dự định của cậu đều thành công và gặp thật nhiều may mắn! 🌟",
            "Chúc cậu luôn được yêu thương, chăm sóc và hạnh phúc mỗi ngày! 🥰",
            "Cười thật nhiều nha, vì nụ cười của cậu xinh lắm đó! 😊❤️"
        ];

        let currentIndex = 0;
        let isTyping = false;

        // Hiệu ứng gõ chữ (Typewriter effect)
        function typeWriter(text) {
            isTyping = true;
            const elem = document.getElementById("typewriter");
            elem.innerHTML = "";
            let i = 0;
            function type() {
                if (i < text.length) {
                    elem.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, 40);
                } else {
                    isTyping = false;
                }
            }
            type();
        }

        // Chuyển lời chúc + Hiệu ứng pháo hoa
        function nextMessage(e) {
            if (isTyping) return;
            typeWriter(wishes[currentIndex]);
            currentIndex = (currentIndex + 1) % wishes.length;
            createSparkles(e.clientX, e.clientY);
        }

        // Tạo hiệu ứng tim rơi liên tục ở nền
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = '<i class="fa-solid fa-heart"></i>';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            heart.style.fontSize = Math.random() * 15 + 10 + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
        setInterval(createHeart, 300);

        // Hiệu ứng nổ tim/sao khi bấm nút
        function createSparkles(x, y) {
            for (let i = 0; i < 8; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.innerHTML = '💖';
                sparkle.style.left = x + 'px';
                sparkle.style.top = y + 'px';
                sparkle.style.transform = `translate(${(Math.random() - 0.5) * 100}px, ${(Math.random() - 0.5) * 100}px)`;
                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 600);
            }
        }

        // Bật / Tắt nhạc nền
        function toggleMusic() {
            const audio = document.getElementById('bgMusic');
            const btnText = document.getElementById('musicBtnText');
            if (audio.paused) {
                audio.play();
                btnText.innerText = "Tắt nhạc 🎵";
            } else {
                audio.pause();
                btnText.innerText = "Bật nhạc chill 🎶";
            }
        }
    </script>
</body>
</html>
